name: Diag produksi (sementara)
on:
  push:
    branches: ['diag/prod-check']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cari link file kepemilikan di KSEI
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          for u in https://www.ksei.co.id/archive_download/holding_composition https://web.ksei.co.id/archive_download/holding_composition https://www.ksei.co.id/archive_download/statistik; do
            echo "== $u"
            curl -sS -L -A "$UA" --max-time 60 -o page.html -w "HTTP %{http_code} %{size_download}B\n" "$u" || echo gagal
            grep -oiE 'href="[^"]+\.(zip|xlsx?|txt|pdf)"' page.html | sort -u | head -25
          done
          echo "== cari pola Balancepos"
          grep -oiE '[^"]*balance[^"]*' page.html | sort -u | head
