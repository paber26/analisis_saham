name: Diag produksi (sementara)
on:
  push:
    branches: ['diag/prod-check']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sertifikat HTTPS di VPS
        run: |
          IP=203.145.35.13
          curl -sS --max-time 20 --resolve "cuan.bernaldo.id:443:$IP" -o /dev/null -w "verifikasi ketat: %{http_code} ssl_verify=%{ssl_verify_result}\n" https://cuan.bernaldo.id/ || echo "verifikasi ketat GAGAL"
          echo | openssl s_client -connect $IP:443 -servername cuan.bernaldo.id 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || echo "tidak ada sertifikat"
