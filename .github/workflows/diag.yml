name: Diag produksi (sementara)
on:
  push:
    branches: ['diag/prod-check']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Uji endpoint IDX (data asing/broker)
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          H=(-A "$UA" -H 'Accept: application/json, text/plain, */*' -H 'Referer: https://www.idx.co.id/id/data-pasar/ringkasan-perdagangan/ringkasan-saham/' -H 'Accept-Language: id-ID,id;q=0.9,en;q=0.8')
          t() { echo "== $1"; curl -sS --compressed "${H[@]}" --max-time 30 -o out.bin -w "HTTP %{http_code} %{content_type} %{size_download}B\n" "$1" || echo gagal; head -c 600 out.bin | tr '\n' ' '; echo; echo; }
          t "https://www.idx.co.id/primary/TradingSummary/GetStockSummary?length=9999&start=0&date=20261009"
          t "https://www.idx.co.id/primary/TradingSummary/GetBrokerSummary?length=9999&start=0&date=20261009"
          t "https://www.idx.co.id/primary/TradingSummary/GetForeignStockSummary?length=10&start=0&date=20261009"
          t "https://www.idx.co.id/primary/TradingSummary/GetTradeSummary?length=10&start=0&date=20261009"
          t "https://www.idx.co.id/primary/ListedCompany/GetTradingInfoSS?code=BBCA&length=5&start=0"
