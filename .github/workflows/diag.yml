name: Diag produksi (sementara)
on:
  push:
    branches: ['diag/prod-check']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS + header (siapa yang melayani cuan.bernaldo.id?)
        run: |
          echo "== DNS"; dig +short cuan.bernaldo.id A; dig +short cuan.bernaldo.id CNAME; dig +short bernaldo.id NS
          for p in / /api/screen "/api/sync?token=salah"; do
            echo "== HEAD-ish $p"
            curl -sS -A 'Mozilla/5.0 (diag)' --max-time 60 -o /dev/null -D - "https://cuan.bernaldo.id$p" | grep -iE '^(HTTP|server|x-vercel|x-powered-by|cf-cache-status|cf-ray|age|cache-control|x-nitro|via|x-matched-path|content-type)' || true
          done
          echo "== body /api/sync?token=salah"; curl -sS -A 'Mozilla/5.0 (diag)' --max-time 30 "https://cuan.bernaldo.id/api/sync?token=salah" | head -c 300; echo
