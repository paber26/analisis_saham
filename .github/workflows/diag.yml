name: Diag produksi (sementara)
on:
  push:
    branches: ['diag/prod-check']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /simulasi di produksi
        run: |
          curl -sS -A 'Mozilla/5.0 (diag)' --max-time 60 -o sim.html -w "HTTP %{http_code}\n" https://cuan.bernaldo.id/simulasi
          for t in "Lihat Screening pada tanggal ini" "Modal awal" "Simulasi Mesin Waktu"; do printf '%s: ' "$t"; grep -c "$t" sim.html || true; done
          curl -sS -A 'Mozilla/5.0 (diag)' --max-time 60 -o /dev/null -w "/api/sim/prices HTTP %{http_code}\n" "https://cuan.bernaldo.id/api/sim/prices?codes=BBCA&from=2026-03-02&to=2026-03-20"
          curl -sS -A 'Mozilla/5.0 (diag)' --max-time 60 "https://cuan.bernaldo.id/api/sim/prices?codes=BBCA&from=2026-03-02&to=2026-03-20" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d);const b=r.series[0].bars;console.log('bar pertama', b[0]?.date, '(sebelum from 2026-03-02?)', b[0]?.date < '2026-03-02', 'jumlah', b.length)})"
