name: Diag produksi (sementara)
on:
  push:
    branches: ['diag/prod-check']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Tunggu ML lalu ringkas /api/screen
        run: |
          cat > s.js <<'JS'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('screen.json', 'utf8'));
          const R = s.results;
          const n = (k) => R.filter((r) => r[k] != null).length;
          console.log({ source: s.source, date: s.date, generatedAt: s.generatedAt, count: s.count, rows: R.length });
          console.log('terisi:', JSON.stringify({ sector: n('sector'), per: n('per'), pbv: n('pbv'), roe: n('roe'), evEbitda: n('evEbitda'), fScore: n('fScore'), qvm: n('qvm'), qvmRank: n('qvmRank'), mlScore: n('mlScore') }));
          const tally = (f) => { const m = {}; R.forEach((r) => { const v = String(f(r)); m[v] = (m[v] || 0) + 1; }); return m; };
          console.log('likuiditas:', JSON.stringify(tally((r) => r.liquidity)));
          console.log('fScoreMax:', JSON.stringify(tally((r) => r.fScoreMax)));
          console.log('fScore (max 9):', JSON.stringify(tally((r) => (r.fScoreMax === 9 ? r.fScore : 'x'))));
          const likuid = R.filter((r) => r.liquidity !== 'tipis');
          console.log('non-tipis:', likuid.length, 'dgn fScore:', likuid.filter((r) => r.fScore != null).length, 'dgn sector:', likuid.filter((r) => r.sector != null).length);
          console.log('contoh fScore null (non-tipis):', likuid.filter((r) => r.fScore == null).slice(0, 15).map((r) => `${r.code}(${r.sector || '-'})`).join(' '));
          console.log('ML meta:', JSON.stringify(s.ml, null, 1));
          const pick = (r) => ({ code: r.code, sector: r.sector, ml: r.mlScore, f: r.fScore != null ? `${r.fScore}/${r.fScoreMax}` : null, ev: r.evEbitda, liq: r.liquidity, qvm: r.qvm, score: r.score });
          const top = R.filter((r) => r.mlScore != null).sort((a, b) => b.mlScore - a.mlScore);
          console.log('ML top 10:'); console.table(top.slice(0, 10).map(pick));
          const q = R.filter((r) => r.qvmRank != null).sort((a, b) => a.qvmRank - b.qvmRank);
          console.log('QVM top 10:'); console.table(q.slice(0, 10).map(pick));
          JS
          for i in $(seq 1 24); do
            curl -sS -A 'Mozilla/5.0 (diag)' --max-time 60 -o screen.json https://cuan.bernaldo.id/api/screen || true
            if node -e "const s=JSON.parse(require('fs').readFileSync('screen.json','utf8')); process.exit(s.ml ? 0 : 1)" 2>/dev/null; then echo "ML siap (percobaan $i)"; break; fi
            echo "percobaan $i: ML belum ada, tunggu 30 dtk"; sleep 30
          done
          node s.js
