name: Diag produksi (sementara)
on:
  push:
    branches: ['diag/prod-check']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kepemilikan KSEI di cuan.bernaldo.id
        run: |
          B=https://cuan.bernaldo.id
          for s in BBCA GOTO; do curl -sS -A 'Mozilla/5.0 (diag)' --max-time 60 "$B/api/ownership?symbol=$s" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const o=JSON.parse(d);console.log('$s', o.available, o.date, JSON.stringify(o.latest), 'seri:', (o.series||[]).length, 'bln')})"; done
          curl -sS -A 'Mozilla/5.0 (diag)' --max-time 60 -o screen.json "$B/api/screen"
          node -e "const s=JSON.parse(require('fs').readFileSync('screen.json','utf8'));const R=s.results;console.log({source:s.source,count:s.count,own:R.filter(r=>r.own).length,ownDate:s.ownership?.date,months:s.ownership?.months,anySig:s.ownership?.evaluation?.signals.some(x=>x.significant)});const t=R.filter(r=>r.own?.dForeign3!=null&&r.liquidity!=='tipis').sort((a,b)=>b.own.dForeign3-a.own.dForeign3);console.log('Δ asing 3b terbesar (non-tipis):',t.slice(0,5).map(r=>r.code+' '+r.own.dForeign3).join(', '));console.log('terkecil:',t.slice(-5).map(r=>r.code+' '+r.own.dForeign3).join(', '))"
          curl -sS -A 'Mozilla/5.0 (diag)' --max-time 60 -o page.html -w "/analisa/BBCA HTTP %{http_code}\n" "$B/analisa/BBCA"; grep -o 'Kepemilikan Saham (KSEI)' page.html | head -1 || echo "kartu belum di SSR (dimuat lazy di browser)"
