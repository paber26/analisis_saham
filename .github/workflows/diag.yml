name: Diag produksi (sementara)
on:
  push:
    branches: ['diag/prod-check']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ksei-ownership
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syncKsei() end-to-end (store sementara)
        run: |
          export DATA_STORE_DIR=$RUNNER_TEMP/store
          cat > /tmp/run.mts <<'TS'
          const R = process.env.GITHUB_WORKSPACE;
          const t0 = Date.now();
          const { syncKsei } = await import(`${R}/server/utils/kseiSync.ts`);
          const snap = await syncKsei();
          console.log(`run 1: ${((Date.now() - t0) / 1000).toFixed(0)} s, bulan ${snap?.months}, data ${snap?.date}, saham ${Object.keys(snap?.latest || {}).length}`);
          console.table(snap?.evaluation?.signals.map(({ label, ...s }: any) => s));
          for (const c of ['BBCA', 'TLKM', 'ADRO', 'GOTO']) console.log(c, JSON.stringify(snap?.latest[c]));
          const t1 = Date.now();
          const again = await syncKsei();
          console.log(`run 2 (tidak ada bulan baru): ${((Date.now() - t1) / 1000).toFixed(1)} s, bulan ${again?.months}`);
          TS
          npx -y tsx@4.19.2 /tmp/run.mts
          du -sh $DATA_STORE_DIR/ksei; ls $DATA_STORE_DIR/ksei | head -2; ls $DATA_STORE_DIR/ksei | tail -2; ls -la $DATA_STORE_DIR/ksei-latest.json
