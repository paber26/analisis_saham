name: Diag produksi (sementara)
on:
  push:
    branches: ['diag/prod-check']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ksei-ownership
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluasi sinyal kepemilikan KSEI 2020–2026
        run: |
          cat > /tmp/eval.mts <<'TS'
          const R = process.env.GITHUB_WORKSPACE;
          const { fetchKseiMonth, monthsUntil } = await import(`${R}/server/utils/kseiFetch.ts`);
          const { evaluateOwnership } = await import(`${R}/server/utils/ksei.ts`);
          const months: any[] = [];
          const missing: string[] = [];
          for (const { year, month } of monthsUntil({ year: 2019, month: 12 })) {
            const m = await fetchKseiMonth(year, month);
            if (m) months.push(m); else missing.push(`${year}-${month}`);
            await new Promise((r) => setTimeout(r, 300));
          }
          console.log(`bulan: ${months.length}, gagal: ${missing.join(' ') || '-'}; saham/bulan terakhir: ${Object.keys(months.at(-1)?.rows || {}).length}`);
          const show = (title: string, ms: any[]) => {
            const ev = evaluateOwnership(ms);
            if (!ev) return console.log(title, 'tidak cukup data');
            console.log(`\n== ${title}: ${ev.from} → ${ev.to}, rata-rata ${ev.avgStocks} saham/bulan`);
            console.table(ev.signals.map(({ label, ...s }) => s));
          };
          show('Semua (mcap ≥ Rp0,5T)', months);
          const half = Math.floor(months.length / 2);
          show('Paruh 1', months.slice(0, half + 1));
          show('Paruh 2', months.slice(half - 3));
          const big = months.map((m) => ({ ...m, rows: Object.fromEntries(Object.entries(m.rows).filter(([, r]: any) => r.price * r.shares >= 5e12)) }));
          show('Big cap saja (mcap ≥ Rp5T)', big);
          TS
          npx -y tsx@4.19.2 /tmp/eval.mts
